# Builds every pushed branch and publishes it to the gh-pages branch:
#   main            → https://kaleab-a.github.io/last-personal-website/
#   any other branch → https://kaleab-a.github.io/last-personal-website/preview/<branch>/
# ("/" in branch names becomes "-", so feat/folder-tabs → preview/feat-folder-tabs/)
name: Deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

# One queue per branch: a newer push to the same branch replaces an older run.
# Different branches deploy in parallel. (A single shared group would make
# GitHub cancel all but one waiting run when several branches are pushed at
# once.) Pushes to gh-pages can still race, so the publish step retries.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Work out where this branch goes
        id: target
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9]+#-#g; s#^-+|-+$##g')
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$BRANCH" = "main" ]; then
            echo "base=/$REPO/" >> "$GITHUB_OUTPUT"
            echo "dest=." >> "$GITHUB_OUTPUT"
            echo "preview=false" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO/preview/$SLUG/" >> "$GITHUB_OUTPUT"
            echo "dest=preview/$SLUG" >> "$GITHUB_OUTPUT"
            echo "preview=true" >> "$GITHUB_OUTPUT"
          fi
          echo "url=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/$REPO/$([ "$BRANCH" = main ] || echo "preview/$SLUG/")" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.target.outputs.base }}
          PUBLIC_PREVIEW: ${{ steps.target.outputs.preview }}
          PUBLIC_BRANCH: ${{ github.ref_name }}

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEST: ${{ steps.target.outputs.dest }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish() {
            rm -rf pages
            git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages || return 1
            if [ "$DEST" = "." ]; then
              # Live site: replace everything except the branch previews.
              find pages -mindepth 1 -maxdepth 1 ! -name .git ! -name preview -exec rm -rf {} +
              cp -R dist/. pages/
            else
              rm -rf "pages/$DEST"
              mkdir -p "pages/$DEST"
              cp -R dist/. "pages/$DEST/"
            fi
            # Without this GitHub Pages runs Jekyll, which hides the _astro/ folder.
            touch pages/.nojekyll
            git -C pages add -A
            git -C pages commit -qm "Deploy ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" || { echo "Nothing changed"; return 0; }
            git -C pages push
          }
          # Another branch may push to gh-pages between our clone and push.
          # Each branch owns its own folder, so starting over from a fresh
          # clone always works; just try again.
          for attempt in $(seq 1 10); do
            publish && exit 0
            echo "Push rejected (attempt $attempt); retrying from a fresh clone"
            sleep $((attempt * 3 + RANDOM % 5))  # back off, with jitter so retries spread out
          done
          exit 1

      - name: Summary
        run: echo "Deployed to ${{ steps.target.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
