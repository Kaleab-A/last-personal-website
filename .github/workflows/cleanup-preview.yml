# When a branch is deleted (e.g. after merging), remove its preview folder.
name: Clean up preview

on:
  delete:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Remove preview/<branch>
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.ref }}
        run: |
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9]+#-#g; s#^-+|-+$##g')
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remove() {
            rm -rf pages
            git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages || return 1
            if [ ! -d "pages/preview/$SLUG" ]; then
              echo "No preview for $BRANCH"
              return 0
            fi
            git -C pages rm -rq "preview/$SLUG"
            git -C pages commit -qm "Remove preview for deleted branch $BRANCH"
            git -C pages push
          }
          # A deploy may push to gh-pages at the same moment; retry from a fresh clone.
          for attempt in $(seq 1 10); do
            remove && exit 0
            echo "Push rejected (attempt $attempt); retrying"
            sleep $((attempt * 3 + RANDOM % 5))  # back off, with jitter so retries spread out
          done
          exit 1
